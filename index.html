<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    
    <!-- Viewport exclusivo para celular (sem zoom acidental, seguro para notch e gestos) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Cores de tema do Android e navegador -->
    <meta name="theme-color" content="#16061F" />
    <meta name="msapplication-navbutton-color" content="#16061F" />
    
    <!-- Compatibilidade Oficial com iOS / Safari (iPhone e iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Entregador" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Compatibilidade Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NovaesWeb Entregador" />
    <meta name="description" content="Aplicativo oficial para entregadores e motoboys NovaesWeb" />
    <link rel="manifest" href="/manifest.json" />

    <title>NovaesWeb Entregador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  </body>
