name: Publish official Android update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-update.yml

permissions:
  contents: write

concurrency:
  group: official-android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check compatible signing key is configured
        id: key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Cannot publish Android 1.1.8: original v1.1.6 signing key is not configured as ANDROID_DEBUG_KEYSTORE_BASE64. Never generate a new key for an in-place update."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.available == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.key.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: steps.key.outputs.available == 'true'
        with:
          packages: ''
      - name: Restore original Android signing identity
        if: steps.key.outputs.available == 'true'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: npm ci
        if: steps.key.outputs.available == 'true'
      - run: npm run android:sync
        if: steps.key.outputs.available == 'true'
      - name: Build official APK
        if: steps.key.outputs.available == 'true'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Confirm APK identity and signing certificate match existing installation
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run test
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/p' android/app/build.gradle | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          test -n "$version_name" && test -n "$version_code"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          test -n "$aapt" && test -n "$apksigner"
          olddir="$(mktemp -d)"
          gh release download android-v1.1.7 --repo "${GITHUB_REPOSITORY}" --pattern '*.apk' --dir "$olddir"
          oldapk="$(find "$olddir" -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$oldapk"
          oldcert="$("$apksigner" verify --print-certs "$oldapk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          newcert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$oldcert" && test -n "$newcert"
          if [ "$oldcert" != "$newcert" ]; then
            echo "::error::APK signature differs from baseline release. Official release BLOCKED: installing over the old app would fail."
            exit 1
          fi
          "$aapt" dump badging "$apk" > /tmp/novaes-badging.txt
          grep -q "^package: name='br.com.novaesweb.entregador' versionCode='${version_code}' versionName='${version_name}'" /tmp/novaes-badging.txt
          mkdir -p /tmp/novaes-release
          asset="/tmp/novaes-release/NovaesWeb-Entregador-v${version_name}-code${version_code}.apk"
          cp "$apk" "$asset"
          (cd /tmp/novaes-release && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")
          echo "signature match confirmed; Android ${version_name} (code ${version_code})"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
      - name: Publish downloadable official update
        if: steps.key.outputs.available == 'true'
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/p' android/app/build.gradle | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          tag="android-v${version_name}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists; no silent overwrite allowed."
            exit 1
          fi
          gh release create "$tag" /tmp/novaes-release/*.apk /tmp/novaes-release/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "NovaesWeb Entregador ${version_name}" \
            --notes "Atualização ${version_name} (código ${version_code}). Mantém conta, rotas, entregas, histórico e configurações existentes."
