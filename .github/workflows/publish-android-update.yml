name: Publish official Android update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android-update.yml

permissions:
  contents: write

concurrency:
  group: official-android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check compatible signing key is configured
        id: key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::notice::Release blocked: configure ANDROID_DEBUG_KEYSTORE_BASE64 with the original debug.keystore used for v1.1.5. Never replace this key with a newly generated one."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.available == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.key.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: steps.key.outputs.available == 'true'
        with:
          packages: ''
      - name: Restore original Android signing identity
        if: steps.key.outputs.available == 'true'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: npm ci
        if: steps.key.outputs.available == 'true'
      - run: npm run android:sync
        if: steps.key.outputs.available == 'true'
      - name: Build official APK
        if: steps.key.outputs.available == 'true'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Confirm APK identity and signing certificate match existing installation
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          test -n "$aapt" && test -n "$apksigner"
          olddir="$(mktemp -d)"
          gh release download android-v1.1.5 --repo "${GITHUB_REPOSITORY}" --pattern '*.apk' --dir "$olddir"
          oldapk="$(find "$olddir" -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$oldapk"
          oldcert="$("$apksigner" verify --print-certs "$oldapk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          newcert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$oldcert" && test -n "$newcert"
          if [ "$oldcert" != "$newcert" ]; then
            echo "::error::APK signature differs from Android v1.1.5. Official release BLOCKED: installing over the old app would fail."
            exit 1
          fi
          "$aapt" dump badging "$apk" > /tmp/novaes-badging.txt
          grep -q "^package: name='br.com.novaesweb.entregador' versionCode='8' versionName='1.1.6'" /tmp/novaes-badging.txt
          mkdir -p /tmp/novaes-release
          asset="/tmp/novaes-release/NovaesWeb-Entregador-v1.1.6-code8.apk"
          cp "$apk" "$asset"
          (cd /tmp/novaes-release && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")
          echo "signature match confirmed; Android versionCode 8"
      - name: Publish downloadable official update
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-v1.1.6 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release android-v1.1.6 already exists; no silent overwrite allowed."
            exit 1
          fi
          gh release create android-v1.1.6 /tmp/novaes-release/*.apk /tmp/novaes-release/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "NovaesWeb Entregador 1.1.6" \
            --notes "Atualização 1.1.6 (código 8): biometria opcional por digital ou rosto no Android, proteção de sessão criptografada, migração de sessão e proteção das confirmações offline. Instale fora de uma entrega ativa."
