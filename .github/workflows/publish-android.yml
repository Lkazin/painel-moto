name: Publish Android APK (signed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android.yml'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require original Android signing key
        env:
          ORIGINAL_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ORIGINAL_DEBUG_KEYSTORE" ]; then
            echo "::error::Configure ANDROID_DEBUG_KEYSTORE_BASE64 with the same debug.keystore used for v1.1.8. Never publish an APK signed by a different key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ORIGINAL_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Install dependencies and build native web bundle
        run: |
          npm ci
          npm run android:sync
      - name: Build signed debug APK using original signing key
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Inspect Android package and prepare distribution
        run: |
          npm run android:release-files
          mkdir -p release-assets
          cp .android-tools/releases/android-v1.1.9/*.apk release-assets/
          cp .android-tools/releases/android-v1.1.9/*.sha256 release-assets/
          cp .android-tools/releases/android-v1.1.9/release-notes.md release-assets/
          apksigner verify --verbose release-assets/*.apk
      - name: Publish official GitHub release (only after successful build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.1.9 >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite an APK."
            exit 1
          fi
          gh release create android-v1.1.9 release-assets/*.apk release-assets/*.sha256 \
            --title "NovaesWeb Entregador v1.1.9" \
            --notes-file release-assets/release-notes.md \
            --latest --target main
