name: Sync signing key
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare keystore artifact
        env:
          KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p output
          printf '%s' "$KEY" | base64 --decode > output/installed-v118.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: installed-keystore
          path: output/installed-v118.keystore
