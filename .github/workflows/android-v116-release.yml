name: Publish NovaesWeb Entregador Android 1.1.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/android-v116-release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Confirm original signing key exists
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "::error::A chave original de assinatura não foi configurada (ANDROID_DEBUG_KEYSTORE_BASE64). O APK não será publicado."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android >/dev/null
      - run: npm ci
      - name: Verify web and authentication tests
        run: |
          npm run build
          node --test scripts/account-session.test.cjs scripts/startup-flow.test.cjs scripts/app-updates.test.cjs scripts/android-release.test.cjs
      - name: Prepare official Android assets
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          npm run android:sync
          chmod +x android/gradlew
          cd android && ./gradlew :app:assembleDebug --no-daemon
      - name: Confirm identity, version, AND certificate against installed release
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='br.com.novaesweb.entregador' versionCode='8' versionName='1.1.6'"
          curl --fail --location --retry 3 --silent --show-error -o /tmp/entregador-115.apk "https://github.com/Lkazin/painel-moto/releases/download/android-v1.1.5/NovaesWeb-Entregador-v1.1.5-code7.apk"
          old=$("$APKSIGNER" verify --print-certs /tmp/entregador-115.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          new=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)
          expected="113a080fb1c9ab56cb9eac4d6fe38b3b548017f1774de818b539abeb4c8a83ab"
          if [ -z "$new" ] || [ "$new" != "$old" ] || [ "$new" != "$expected" ]; then
            echo "::error::A assinatura do APK 1.1.6 não corresponde à 1.1.5. Publicação interrompida."
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/NovaesWeb-Entregador-v1.1.6-code8.apk
          (cd release && sha256sum NovaesWeb-Entregador-v1.1.6-code8.apk > NovaesWeb-Entregador-v1.1.6-code8.apk.sha256)
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-v1.1.6 >/dev/null 2>&1; then
            echo "::error::A release android-v1.1.6 já existe; não vamos sobrescrever o APK."
            exit 1
          fi
          gh release create android-v1.1.6             release/NovaesWeb-Entregador-v1.1.6-code8.apk             release/NovaesWeb-Entregador-v1.1.6-code8.apk.sha256             --target "${GITHUB_SHA}" --title "NovaesWeb Entregador 1.1.6"             --notes "Biometria ou reconhecimento facial opcional nas configurações, proteção de sessão e armazenamento criptografado no Android. Preserva a opção de entrar com telefone e senha. Conclua entregas em andamento antes de instalar."             --latest
