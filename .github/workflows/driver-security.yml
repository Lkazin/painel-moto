name: Driver biometric and session security
on:
  push:
    branches:
      - feat/driver-optional-biometric-secure-session
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/account-session.test.cjs scripts/startup-flow.test.cjs
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew :app:assembleDebug --no-daemon
